<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Album</title>
    <meta name="description" content="A fast static gallery generated from an iCloud Shared Album.">
    <link rel="stylesheet" href="styles.css?v=__BUILD_VERSION__">
    <script defer src="app.js?v=__BUILD_VERSION__"></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero__shell">
        <h1 id="album-title">Loading album...</h1>
        <p id="album-summary" class="hero__summary">Fetching album data.</p>
      </div>
    </header>

    <main class="page">
      <section class="controls" aria-label="Gallery controls">
        <label class="field">
          <span>Search</span>
          <input id="search-input" type="search" placeholder="Search captions or names">
        </label>

        <label class="field">
          <span>Type</span>
          <select id="type-filter">
            <option value="all">All media</option>
            <option value="photo">Photos</option>
            <option value="video">Videos</option>
          </select>
        </label>

        <label class="field">
          <span>Contributor</span>
          <select id="contributor-filter">
            <option value="all">Everyone</option>
          </select>
        </label>

        <label class="field">
          <span>Sort</span>
          <select id="sort-order">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
        </label>
      </section>

      <section id="gallery" class="gallery" aria-live="polite"></section>
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
      <p id="empty-state" class="empty-state" hidden>No items match the current filters.</p>
    </main>

    <section id="lightbox" class="lightbox" hidden aria-modal="true" role="dialog">
      <div class="lightbox__backdrop" data-close></div>
      <div class="lightbox__panel">
        <div class="lightbox__toolbar">
          <button class="lightbox__nav lightbox__nav--prev" type="button" id="prev-item" aria-label="Previous item">Prev</button>
          <div class="lightbox__toolbar-group">
            <button class="lightbox__nav lightbox__nav--next" type="button" id="next-item" aria-label="Next item">Next</button>
            <button class="lightbox__close" type="button" data-close aria-label="Close viewer">Close</button>
          </div>
        </div>

        <div id="lightbox-media" class="lightbox__media"></div>
        <div class="lightbox__meta">
          <p id="lightbox-title" class="lightbox__title"></p>
          <p id="lightbox-details" class="lightbox__details"></p>
        </div>
      </div>
    </section>

    <noscript>
      <p class="noscript">This gallery needs JavaScript to render the album.</p>
    </noscript>
  </body>
</html>
